include omnetpp.ini

# Common settings for the experiments.
[Config CampaignBase]
sim-time-limit = -1s
*.node[*].initiator = (index == 0)
*.node[*].crashProb = 0
*.node[*].lossProb = 0
**.channel.delay = 1ms
repeat = 1
seed-set = ${repetition}

# Six topology families, four sizes each.
[Config C1_Size]
extends = CampaignBase
network = ${net=synthetic.Line10,synthetic.Line20,synthetic.Line50,synthetic.Line100,synthetic.Ring10,synthetic.Ring20,synthetic.Ring50,synthetic.Ring100,synthetic.Tree10,synthetic.Tree20,synthetic.Tree50,synthetic.Tree100,synthetic.Grid10,synthetic.Grid20,synthetic.Grid50,synthetic.Grid100,synthetic.Complete10,synthetic.Complete20,synthetic.Complete50,synthetic.Complete100,synthetic.Random10,synthetic.Random20,synthetic.Random50,synthetic.Random100}

# Three networks, three constant delays.
[Config C2_Delay_Real]
extends = CampaignBase
network = ${net=real.Abilene,real.Geant,real.Germany50}
**.channel.delay = ${d=1,5,10}ms

# Three networks, ten random-delay repetitions each.
[Config C2_RandomDelay]
extends = CampaignBase
network = ${net=real.Abilene,real.Geant,real.Germany50}
**.channel.delay = uniform(1ms, 10ms)
repeat = 10

# Every node takes a turn as initiator.
[Config C3_Initiator_Abilene]
extends = CampaignBase
network = real.Abilene
*.node[*].initiator = (index == ${src=0..11})

[Config C3_Initiator_Geant]
extends = CampaignBase
network = real.Geant
*.node[*].initiator = (index == ${src=0..21})

[Config C3_Initiator_Germany50]
extends = CampaignBase
network = real.Germany50
*.node[*].initiator = (index == ${src=0..49})

# Crash probability varies; message loss remains disabled.
[Config C4_Crash]
extends = CampaignBase
network = real.Geant
*.node[*].crashProb = ${p=0,0.1,0.2,0.3}
repeat = 20

# Message loss varies; crashes remain disabled.
[Config C4_Loss]
extends = CampaignBase
network = real.Geant
*.node[*].lossProb = ${q=0,0.05,0.1,0.2}
repeat = 20
