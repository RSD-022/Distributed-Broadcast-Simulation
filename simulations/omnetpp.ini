[General]
sim-time-limit = 100s
**.vector-recording = false
# One folder per config, as scripts/summary.sh expects: results/<config>/*.sca
result-dir = results/${configname}
*.node[*].initiator = (index == 0)
# The lab network, kept as the reference run: 10 messages, last event at t=0.4s.
[Config RunDiffuse3]
network = Network3

# Validation suite V1-V7 (all links 1 ms). Expected values: tests/validation_results.md
[Config V1_Single]
network = validation.Single

[Config V2_Line6]
network = validation.Line6

[Config V3_Tree7]
network = validation.Tree7

[Config V4_Ring4]
network = validation.Ring4

[Config V5_Cyclic6]
network = validation.Cyclic6

# Three runs: initiator 0 (end), 2 (middle), 5 (other end).
[Config V6_Line6Initiators]
network = validation.Line6
*.node[*].initiator = (index == ${init=0,2,5})

[Config V7_Gaps]
network = validation.Gaps

# Campaign: effect of link delay on Line6
[Config C2_Delay_Line6]
network = validation.Line6

# Keep the initiator fixed.
*.node[*].initiator = (index == 0)

# Three runs: 1 ms, 5 ms and 10 ms.
**.channel.delay = ${d=1,5,10}ms

repeat = 1
# Reliable baseline.
[Config F7_NoFailures]
network = validation.Line6
*.node[*].initiator = (index == 0)
*.node[*].crashProb = 0
*.node[*].lossProb = 0

# Every attempted message is lost.
[Config F7_AllLost]
network = validation.Line6
*.node[*].initiator = (index == 0)
*.node[*].crashProb = 0
*.node[*].lossProb = 1

# All non-initiators start crashed.
[Config F7_AllCrashed]
network = validation.Line6
*.node[*].initiator = (index == 0)
*.node[*].crashProb = 1
*.node[*].lossProb = 0

# Only node 2 crashes.
[Config F7_MiddleCrash]
network = validation.Line6
*.node[*].initiator = (index == 0)
*.node[2].crashProb = 1
*.node[*].crashProb = 0
*.node[*].lossProb = 0
